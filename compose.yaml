name: keyguard
x-app: &app
  image: keyguard:local
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [private]
  pids_limit: 128
  mem_limit: 512m
services:
  db:
    image: ${KIG_POSTGRES_IMAGE:-postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d}
    environment:
      POSTGRES_DB: keyguard
      POSTGRES_USER: kig_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, app_password]
    volumes:
      - db:/var/lib/postgresql/data
      - ./deploy/create-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime.sh:ro
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kig_owner -d keyguard"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    user: "0:0"
    command: [migrate]
    environment:
      DATABASE_URL_FILE: /run/secrets/owner_dsn
    secrets: [owner_dsn]
    depends_on:
      db: {condition: service_healthy}
  bootstrap:
    <<: *app
    user: "0:0"
    profiles: [setup]
    command: [bootstrap, --audit-key, /run/secrets/audit_key, --genesis, /run/secrets/genesis]
    environment:
      DATABASE_URL_FILE: /run/secrets/owner_dsn
    secrets: [owner_dsn, audit_key, genesis]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *app
    build: .
    networks: [private, frontend]
    # A dedicated host UID owns the supplied secrets; set KIG_UID/GID accordingly.
    user: "${KIG_UID:-1000}:${KIG_GID:-1000}"
    command: [serve, --min-protocol, "${KIG_MIN_PROTOCOL:-2}", --listen, "0.0.0.0:8443", --audit-key, /run/secrets/audit_key, --tls-cert, /run/secrets/tls_cert, --tls-key, /run/secrets/tls_key]
    environment:
      DATABASE_URL_FILE: /run/secrets/app_dsn
    secrets: [app_dsn, audit_key, tls_cert, tls_key]
    ports: ["127.0.0.1:8443:8443"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  db:
networks:
  frontend: {}
  private:
    internal: true
secrets:
  postgres_password: {file: ./.local/postgres-password}
  app_password: {file: ./.local/app-password}
  owner_dsn: {file: ./.local/owner-dsn}
  app_dsn: {file: ./.local/app-dsn}
  audit_key: {file: ./.local/audit.json}
  genesis: {file: ./.local/genesis.json}
  tls_cert: {file: ./.local/tls-cert.pem}
  tls_key: {file: ./.local/tls-key.pem}
